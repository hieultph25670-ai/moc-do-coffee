<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - Mộc Đỏ Coffee</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* CSS bổ sung riêng cho form */
        .auth-container {
            max-width: 450px;
            margin: 60px auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .auth-container h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #78350f;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
        }
        .form-group input:focus {
            border-color: #b45309;
            outline: none;
            box-shadow: 0 0 0 3px rgba(180, 83, 9, 0.1);
        }
        .error-msg {
            color: #dc2626;
            font-size: 12px;
            margin-top: 4px;
            display: block;
        }
        .auth-btn {
            width: 100%;
            padding: 12px;
            background-color: #b45309;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .auth-btn:hover {
            background-color: #92400e;
        }
        .auth-switch {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }
        .auth-switch a {
            color: #b45309;
            text-decoration: none;
            font-weight: 600;
        }
        .auth-switch a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2>Đăng Ký Tài Khoản</h2>
        <form id="registerForm">
            <div class="form-group">
                <label>Họ và tên</label>
                <input type="text" id="fullname" placeholder="Nhập họ và tên đầy đủ">
                <span class="error-msg" id="errFullname"></span>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="example@gmail.com">
                <span class="error-msg" id="errEmail"></span>
            </div>

            <div class="form-group">
                <label>Số điện thoại</label>
                <input type="tel" id="phone" placeholder="Nhập 10 chữ số SĐT">
                <span class="error-msg" id="errPhone"></span>
            </div>

            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="password" placeholder="Ít nhất 6 ký tự">
                <span class="error-msg" id="errPassword"></span>
            </div>

            <div class="form-group">
                <label>Xác nhận mật khẩu</label>
                <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu">
                <span class="error-msg" id="errConfirm"></span>
            </div>

            <button type="submit" class="auth-btn">Đăng Ký</button>

            <div class="auth-switch">
                Đã có tài khoản? <a href="dangnhap.html">Đăng nhập ngay</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            let fullname = document.getElementById('fullname').value.trim();
            let email = document.getElementById('email').value.trim();
            let phone = document.getElementById('phone').value.trim();
            let password = document.getElementById('password').value;
            let confirmPassword = document.getElementById('confirmPassword').value;

            let isValid = true;

            // Reset thông báo lỗi
            document.getElementById('errFullname').innerText = '';
            document.getElementById('errEmail').innerText = '';
            document.getElementById('errPhone').innerText = '';
            document.getElementById('errPassword').innerText = '';
            document.getElementById('errConfirm').innerText = '';

            // Kiểm tra họ tên
            if (fullname === '') {
                document.getElementById('errFullname').innerText = 'Vui lòng nhập họ và tên.';
                isValid = false;
            }

            // Kiểm tra email cơ bản
            let emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                document.getElementById('errEmail').innerText = 'Email không đúng định dạng.';
                isValid = false;
            }

            // Kiểm tra số điện thoại (10 số, bắt đầu bằng số 0)
            let phoneRegex = /^0\d{9}$/;
            if (!phoneRegex.test(phone)) {
                document.getElementById('errPhone').innerText = 'Số điện thoại phải gồm 10 chữ số và bắt đầu bằng số 0.';
                isValid = false;
            }

            // Kiểm tra mật khẩu
            if (password.length < 6) {
                document.getElementById('errPassword').innerText = 'Mật khẩu phải có ít nhất 6 ký tự.';
                isValid = false;
            }

            // Kiểm tra khớp mật khẩu
            if (password !== confirmPassword) {
                document.getElementById('errConfirm').innerText = 'Mật khẩu xác nhận không khớp.';
                isValid = false;
            }

            if (isValid) {
                // Lưu dữ liệu vào localStorage
                let userData = { fullname, email, phone, password };
                localStorage.setItem('user_' + email, JSON.stringify(userData));

                alert('Đăng ký tài khoản thành công!');
                window.location.href = 'dangnhap.html';
            }
        });
    </script>
</body>
</html>
